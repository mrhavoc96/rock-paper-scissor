<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>



    <div class="scoreBoard">
        <p class = "cScore">Computer Score: <span class="spanOne">0</span> </p>
        <p class = "hScore">Human Score: <span class="spanTwo">0</span></p>
    </div>

    <div class="currentSelections">

        <div class="computerSelDiv">
            <p class="cSelection">None</p>
            <p>COMPUTER</p>
        </div>

        <div class="versus">
            V/S
        </div>

        <div class="humanSelDiv">
            <p class="hSelection">None</p>
            <p>YOU</p>
        </div>

    </div>

    <div class="lineOne">

    </div>

    <ul>
        <li><button class="rock">ROCK</button></li>
        <li><button class="paper">PAPER</button></li>
        <li><button class="scissors">SCISSOR</button></li>
    </ul>


    <div class="result">
        <p class="resultPara">PLAY!</p>
    </div>

    <div class="resetDiv">
        
    </div>
    
    <script src="index.js"></script>

</body>
</html>
